<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@400;500;700&family=Nunito+Sans:wght@400;500;600;700&display=swap">
  <style>
    :root {
      --ground: #F4F7FB;
      --surface: #E4ECF6;
      --paper: #FFFFFF;
      --ink: #15203A;
      --ink-soft: #475571;
      --accent: #B23A0A;
      --sky: #1E63B0;
      --flame: #F5A524;
      --border: rgba(21, 32, 58, 0.15);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --ground: #0F1828;
        --surface: #1A2640;
        --paper: #1A2640;
        --ink: #E8EDF5;
        --ink-soft: #A3B0C6;
        --accent: #FF8A4C;
        --sky: #6CB4F0;
        --flame: #F5A524;
        --border: rgba(232, 237, 245, 0.15);
      }
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--ground);
      color: var(--ink);
      font-family: 'Nunito Sans', -apple-system, sans-serif;
      font-size: 17px;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      max-width: 680px;
      margin: 0 auto;
      padding: 2rem 1.5rem 6rem;
    }

    h1, h2, h3 {
      font-family: 'Bitter', Georgia, serif;
      color: var(--ink);
      text-wrap: balance;
    }

    h1 { font-size: 2.2rem; font-weight: 700; line-height: 1.2; margin-bottom: 1rem; }
    h1::after {
      content: "";
      display: block;
      width: 3rem;
      height: 4px;
      margin-top: 0.75rem;
      border-radius: 2px;
      background: var(--flame);
    }
    h2 { font-size: 1.4rem; font-weight: 500; margin: 2rem 0 0.8rem; color: var(--sky); }
    h3 { font-size: 1.1rem; font-weight: 500; margin: 1.5rem 0 0.6rem; color: var(--sky); }

    p { margin-bottom: 1rem; max-width: 600px; }

    a {
      color: var(--accent);
      text-decoration-thickness: 1px;
      text-underline-offset: 0.2em;
    }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .nav a { text-decoration: none; }
    .nav a:hover { text-decoration: underline; }

    ul, ol { margin: 0 0 1rem 1.2rem; }
    li { margin-bottom: 0.4rem; }

    .nav {
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
      font-size: 0.85rem;
    }

    .nav a { color: var(--sky); }

    blockquote {
      border-left: 3px solid var(--accent);
      background: var(--surface);
      padding: 1rem 1.25rem;
      margin: 1.5rem 0;
    }
    blockquote > :last-child { margin-bottom: 0; }

    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--paper);
      margin: 1.5rem 0;
      font-size: 0.95rem;
      line-height: 1.5;
    }
    th, td {
      padding: 0.6rem 0.75rem;
      text-align: left;
      vertical-align: top;
      border-bottom: 1px solid var(--border);
    }
    th { font-weight: 600; border-bottom-width: 2px; }

    .diagram { margin: 2rem 0; }
    .diagram svg { display: block; width: 100%; height: auto; }

    code {
      background: var(--surface);
      padding: 0.15em 0.4em;
      border-radius: 3px;
      font-size: 0.9em;
    }

    @media (max-width: 600px) {
      .page { padding: 1.5rem 1.25rem 4rem; }
      h1 { font-size: 1.8rem; }
    }
  </style>
</head>
<body>
  <div class="page">
    {{ content }}
  </div>
</body>
</html>
