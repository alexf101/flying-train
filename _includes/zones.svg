<figure class="diagram">
<svg viewBox="0 0 540 370" role="img" aria-labelledby="zones-title zones-desc">
  <title id="zones-title">The four zones of AI use</title>
  <desc id="zones-desc">A grid of tasks you know how to do versus tasks you don't, against low versus high skill in using AI. Tasks you know with low AI skill: the Bad Zone, worse than doing it yourself, but start here and learn. Tasks you know with high AI skill: the Good Zone, fast, useful results that you can check. Tasks you don't know with high AI skill: the Dream Zone, doing things with AI you couldn't do without it. Tasks you don't know with low AI skill: the Not Yet Zone, inaccurate, harmful outcomes you can't check yourself. Arrows run from Bad to Good to Dream.</desc>
  <defs>
    <marker id="zones-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--ink-soft)"/>
    </marker>
  </defs>
  <g font-size="15" fill="var(--ink-soft)" text-anchor="middle">
    <text x="155" y="24">Tasks you know how to do</text>
    <text x="425" y="24">Tasks you don't</text>
    <text transform="translate(18 110) rotate(-90)">High AI skill</text>
    <text transform="translate(18 290) rotate(-90)">Low AI skill</text>
  </g>
  <rect x="40" y="40" width="230" height="140" rx="8" fill="var(--sky)" fill-opacity="0.14" stroke="var(--sky)"/>
  <rect x="310" y="40" width="230" height="140" rx="8" fill="var(--accent)" fill-opacity="0.14" stroke="var(--accent)"/>
  <rect x="40" y="220" width="230" height="140" rx="8" fill="var(--surface)" stroke="var(--ink-soft)"/>
  <rect x="310" y="220" width="230" height="140" rx="8" fill="none" stroke="var(--ink-soft)" stroke-dasharray="6 5"/>
  <g text-anchor="middle" fill="var(--ink)">
    <g font-family="Bitter, Georgia, serif" font-size="22" font-weight="500">
      <text x="155" y="96">Good Zone</text>
      <text x="425" y="96">Dream Zone</text>
      <text x="155" y="276">Bad Zone</text>
      <text x="425" y="276">Not Yet Zone</text>
    </g>
    <g font-size="16" fill="var(--ink-soft)">
      <text x="155" y="122">Fast, useful results</text>
      <text x="155" y="142">that you can check</text>
      <text x="425" y="122">Doing things with AI you</text>
      <text x="425" y="142">couldn't do without it</text>
      <text x="155" y="302">Worse than doing it yourself,</text>
      <text x="155" y="322">but start here and learn</text>
      <text x="425" y="302">Inaccurate, harmful outcomes</text>
      <text x="425" y="322">you can't check yourself</text>
    </g>
  </g>
  <g stroke="var(--ink-soft)" stroke-width="2" marker-end="url(#zones-arrow)">
    <line x1="155" y1="218" x2="155" y2="184"/>
    <line x1="272" y1="110" x2="306" y2="110"/>
  </g>
</svg>
</figure>
